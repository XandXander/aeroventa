name: implementation-ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate local PHP lead intake (mock mail, no outbound)
        run: |
          php -l apps/web/public/api/lead.php
          python3 tests/test_lead_local.py
          php -l apps/web/public/api/project.php
          python3 tests/test_project_local.py

      - name: Generate route rules
        run: npm run generate:hosting-rules

      - name: Validate implementation contracts
        run: npm run validate

      - name: Check Astro and browser TypeScript
        run: npm run check:web

      - name: Build fixture site
        env:
          AEROVENTA_RELEASE_MODE: fixture
          AEROVENTA_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PUBLIC_SOCIAL_ORIGIN: https://staging.aeroventa.ru
        run: npm run build:web

      - name: Validate generated static site
        env:
          AEROVENTA_RELEASE_MODE: fixture
        run: npm run validate:dist

      - name: Verify final 65-scope source, SEO and original-media contracts
        run: python3 scripts/validate-final-contract.py

      # Artifact delivery only: no changes to the website or deployment.
      - name: Package ready-to-import staging website ZIP
        shell: bash
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          mkdir -p release_out
          python3 scripts/package-final-staging.py apps/web/dist "release_out/AEROVENTA_PR12_STAGING_${SOURCE_SHA:0:8}.zip" "$SOURCE_SHA" > release_out/manifest.json

      - name: Upload ready-to-import staging ZIP
        uses: actions/upload-artifact@v6
        with:
          name: AEROVENTA_PR12_STAGING_IMPORT_ZIP
          path: release_out/AEROVENTA_PR12_STAGING_*.zip
          if-no-files-found: error
          retention-days: 7

      - name: Upload validation artifact
        uses: actions/upload-artifact@v6
        with:
          name: aeroventa-implementation-ci
          path: |
            package-lock.json
            IMPLEMENTATION_STATUS_T2.json
            BUILD_VALIDATION_T2.json
            PRODUCT_EXPERIENCE_VALIDATION.json
            apps/web/dist
          if-no-files-found: error
          retention-days: 7
