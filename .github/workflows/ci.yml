name: implementation-ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate local PHP lead intake (mock mail, no outbound)
        run: |
          php -l apps/web/public/api/lead.php
          python3 tests/test_lead_local.py
          php -l apps/web/public/api/project.php
          python3 tests/test_project_local.py

      - name: Generate route rules
        run: npm run generate:hosting-rules

      - name: Validate implementation contracts
        run: npm run validate

      - name: Check Astro and browser TypeScript
        run: npm run check:web

      - name: Build fixture site
        env:
          AEROVENTA_RELEASE_MODE: fixture
          AEROVENTA_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PUBLIC_SOCIAL_ORIGIN: https://staging.aeroventa.ru
        run: npm run build:web

      - name: Validate generated static site
        env:
          AEROVENTA_RELEASE_MODE: fixture
        run: npm run validate:dist

      # Artifact delivery only: no changes to the website or deployment.
      - name: Package ready-to-import staging website ZIP
        shell: bash
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, zipfile
          from pathlib import Path
          dist=Path('apps/web/dist')
          assert (dist/'index.html').is_file()
          assert (dist/'404.html').is_file()
          paths=sorted(p for p in dist.rglob('*') if p.is_file() and p.name != '.htaccess')
          output=Path('release_out')
          output.mkdir(exist_ok=True)
          source_sha=os.environ['SOURCE_SHA']
          name='AEROVENTA_PR12_STAGING_'+source_sha[:8]+'.zip'
          target=output/name
          with zipfile.ZipFile(target,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=7,allowZip64=True) as z:
            for p in paths:
              z.write(p,p.relative_to(dist).as_posix())
            z.writestr('aeroventa-build.json',json.dumps({
              'source_sha':source_sha,
              'mode':'fixture-staging-only',
              'release':'HOLD',
              'installed_staging_sha':'NOT_ASSERTED'
            },ensure_ascii=False,indent=2)+'\n')
          with zipfile.ZipFile(target) as z:
            assert z.testzip() is None
            assert 'index.html' in z.namelist()
            assert 'aeroventa-build.json' in z.namelist()
            assert '.htaccess' not in z.namelist()
            assert all(not n.startswith('apps/') and not n.startswith('dist/') for n in z.namelist())
          print('READY_FOR_STAGING_IMPORT',name,'BYTES',target.stat().st_size,
                'SHA256',hashlib.sha256(target.read_bytes()).hexdigest(),
                'FILES',len(paths))
          PY

      - name: Upload ready-to-import staging ZIP
        uses: actions/upload-artifact@v6
        with:
          name: AEROVENTA_PR12_STAGING_IMPORT_ZIP
          path: release_out/AEROVENTA_PR12_STAGING_*.zip
          if-no-files-found: error
          retention-days: 7

      - name: Upload validation artifact
        uses: actions/upload-artifact@v6
        with:
          name: aeroventa-implementation-ci
          path: |
            package-lock.json
            IMPLEMENTATION_STATUS_T2.json
            BUILD_VALIDATION_T2.json
            PRODUCT_EXPERIENCE_VALIDATION.json
            apps/web/dist
          if-no-files-found: error
          retention-days: 7
