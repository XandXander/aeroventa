name: V43 owner review — compiled browser screenshots

on:
  pull_request:
    branches: [main, aeroventa/v43-owner-visual-implementation-2026-10-09, aeroventa/hiend-audit-av-correction-2026-10-12]
    paths:
      - 'apps/web/**'
      - 'scripts/render-v43-owner-review.mjs'
      - '.github/workflows/v43-owner-review.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screenshot-review:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.number == 10 || github.event.pull_request.number == 11 || github.event.pull_request.number == 12
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact review commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
      - name: Install project dependencies
        run: npm install --no-audit --no-fund
      - name: Validate and compile fixture site
        env:
          AEROVENTA_RELEASE_MODE: fixture
        run: |
          npm run generate:hosting-rules
          npm run validate
          npm run build:web
          npm run validate:dist
      - name: Install isolated browser test dependency
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1
          npx --no-install playwright install --with-deps chromium
      - name: Launch isolated local HTTP server
        run: |
          nohup python3 -m http.server 4178 --bind 127.0.0.1 --directory apps/web/dist > /tmp/v43-render-http.log 2>&1 &
          echo $! > /tmp/v43-render-http.pid
          for i in $(seq 1 25); do
            if curl --fail --silent http://127.0.0.1:4178/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/v43-render-http.log
          exit 1
      - name: Render real compiled HTML at four viewports
        run: node scripts/render-v43-owner-review.mjs
      - name: Upload browser screenshots and machine report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: v43-final-compiled-browser-owner-review
          path: V43_OWNER_BROWSER_REVIEW
          if-no-files-found: warn
          retention-days: 7
      # This artifact must not replace staging authentication or production Bitrix.
      # Browser QA must PASS first. The archive contains compiled site files
      # at ZIP root. Existing staging .htaccess / Basic Auth MUST be preserved.
      - name: Seal tested staging-only site
        if: success()
        env:
          REVIEW_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test -f apps/web/dist/index.html
          test -f apps/web/dist/.htaccess
          test -f apps/web/dist/404.html
          test -f apps/web/dist/sitemap.xml
          grep -qi 'name="robots" content="noindex' apps/web/dist/index.html
          printf 'User-agent: *\nDisallow: /\n' > apps/web/dist/robots.txt
          cat > apps/web/dist/STAGING_ONLY_BUILD_INFO.txt <<EOF
          AEROVENTA STAGING-ONLY FIXTURE REVIEW BUILD
          GITHUB_SHA=$REVIEW_SHA
          TEST=implementation validation + compiled Playwright browser review PASS
          INDEXING=DISABLED (noindex and robots Disallow)
          DESTINATION=staging.aeroventa.ru ONLY, after verifying existing Basic Auth
          EXISTING_STAGING_HTACCESS=DO_NOT_REPLACE
          ROUTING_RULES_GENERATED=reference-only in STAGING_RULES_REFERENCE_ONLY.txt
          NOT_A_DIRECTUS_PRODUCTION_BUILD
          DO_NOT_UPLOAD_TO_PRODUCTION_OR_REPLACE_LIVE_BITRIX
          EOF
          grep -q '^Disallow: /' apps/web/dist/robots.txt
          grep -q '^DO_NOT_UPLOAD_TO_PRODUCTION' apps/web/dist/STAGING_ONLY_BUILD_INFO.txt
          # Beget staging Basic Auth historically resides inside .htaccess.
          # Never allow this distributable bundle to overwrite that security
          # boundary with the raw generated production routing rules.
          mv apps/web/dist/.htaccess apps/web/dist/STAGING_RULES_REFERENCE_ONLY.txt
          test ! -f apps/web/dist/.htaccess
      - name: Upload exact tested staging-only site
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: AEROVENTA_V43_STAGING_ONLY_SITE_DO_NOT_UPLOAD_TO_PRODUCTION
          path: apps/web/dist/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
          compression-level: 6

  bitrix-source-recovery:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.number == 12
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - name: Build repaired Windows one-click public source capture ZIP
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, zipfile
          routes=json.loads(Path('migration/route-contract.json').read_text(encoding='utf-8'))
          html=[r['path'] for r in routes if r.get('http_outcome')==200 and not r['path'].startswith('/upload/')]
          assert len(html)==29 and len(set(html))==29 and '/' in html
          root=Path('AEROVENTA_BITRIX_PUBLIC_CAPTURE_ONE_CLICK_V2')
          root.mkdir(exist_ok=True)
          for name in ['CAPTURE_BITRIX_PUBLIC.ps1','START_CAPTURE_BITRIX.cmd','README_RU.md']:
              src=Path('scripts/windows-bitrix-capture-v2')/name
              assert src.is_file()
              data=src.read_bytes()
              if name.endswith('.ps1'):
                  data=b'\xef\xbb\xbf'+data.lstrip(b'\xef\xbb\xbf')
              (root/name).write_bytes(data)
          (root/'routes.txt').write_bytes(('\r\n'.join(html)+'\r\n').encode('utf-8-sig'))
          output=Path('AEROVENTA_BITRIX_PUBLIC_CAPTURE_ONE_CLICK_V2.zip')
          with zipfile.ZipFile(output,'w',compression=zipfile.ZIP_DEFLATED) as f:
              for p in sorted(root.iterdir()):
                  f.write(p,p.name)
          with zipfile.ZipFile(output) as f:
              assert len(f.namelist())==4 and f.testzip() is None
          print('WINDOWS_ONE_CLICK_V2_READY',output,len(html))
          PY
      - name: Upload repaired Bitrix Windows owner-capture package
        uses: actions/upload-artifact@v6
        with:
          name: AEROVENTA_BITRIX_PUBLIC_CAPTURE_ONE_CLICK_V2
          path: AEROVENTA_BITRIX_PUBLIC_CAPTURE_ONE_CLICK_V2.zip
          if-no-files-found: error
          retention-days: 7
      - name: Capture 29 public Bitrix HTML and indexed PDF (READ ONLY)
        run: node scripts/capture-bitrix-public-readonly.mjs
      - name: Upload exact public sources; never publish them automatically
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: aeroventa-public-bitrix-readonly-source-evidence
          path: AEROVENTA_BITRIX_READONLY_RECOVERY/
          if-no-files-found: warn
          retention-days: 7
