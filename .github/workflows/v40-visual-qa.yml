name: v40-visual-qa

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: v40-hi-end-evidence-pass-2026-10-03
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'

      - name: Install project
        run: npm install --no-audit --no-fund

      - name: Build fixture
        env:
          AEROVENTA_RELEASE_MODE: fixture
        run: npm run build:web

      - name: Install browser QA dependency
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start preview
        run: |
          npm --workspace @aeroventa/web run preview -- --host 127.0.0.1 --port 4321 > /tmp/aeroventa-preview.log 2>&1 &
          echo $! > /tmp/aeroventa-preview.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4321/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/aeroventa-preview.log
          exit 1

      - name: Render responsive evidence
        run: |
          mkdir -p reports/v40-renders
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          import fs from 'node:fs';

          const targets = [
            { name: 'desktop-1440', width: 1440, height: 1000, fullPage: false },
            { name: 'tablet-834', width: 834, height: 1112, fullPage: false },
            { name: 'mobile-390', width: 390, height: 844, fullPage: false },
            { name: 'mobile-320', width: 320, height: 720, fullPage: false },
            { name: 'mobile-390-full', width: 390, height: 844, fullPage: true },
          ];

          const browser = await chromium.launch();
          const results = [];
          let failed = false;

          for (const target of targets) {
            const context = await browser.newContext({
              viewport: { width: target.width, height: target.height },
              deviceScaleFactor: 1,
              reducedMotion: 'reduce',
            });
            const page = await context.newPage();
            const consoleErrors = [];
            const pageErrors = [];
            page.on('console', msg => { if (msg.type() === 'error') consoleErrors.push(msg.text()); });
            page.on('pageerror', err => pageErrors.push(String(err)));

            const response = await page.goto('http://127.0.0.1:4321/', { waitUntil: 'networkidle' });
            const checks = await page.evaluate(() => ({
              overflow: document.documentElement.scrollWidth - window.innerWidth,
              caseImages: document.querySelectorAll('.case-feature img').length,
              heroSupply: Boolean(document.querySelector('.hero-airflow-path--supply')),
              heroExhaust: Boolean(document.querySelector('.hero-airflow-path--exhaust')),
              brandLoaded: Boolean(document.querySelector('.brand-mark-locked')?.complete),
              title: document.title,
              h1: document.querySelector('h1')?.textContent?.trim() || '',
            }));

            const pass =
              response?.status() === 200 &&
              checks.overflow <= 1 &&
              checks.caseImages === 2 &&
              checks.heroSupply &&
              checks.heroExhaust &&
              checks.brandLoaded &&
              consoleErrors.length === 0 &&
              pageErrors.length === 0;

            if (!pass) failed = true;
            results.push({
              ...target,
              http: response?.status() ?? null,
              ...checks,
              consoleErrors,
              pageErrors,
              pass,
            });

            await page.screenshot({
              path: `reports/v40-renders/${target.name}.png`,
              fullPage: target.fullPage,
            });
            await context.close();
          }

          await browser.close();
          fs.writeFileSync('reports/v40-visual-qa.json', JSON.stringify({
            generatedAt: new Date().toISOString(),
            verdict: failed ? 'FAIL' : 'PASS',
            results,
          }, null, 2));
          console.log(JSON.stringify({ verdict: failed ? 'FAIL' : 'PASS', results }, null, 2));
          if (failed) process.exit(1);
          NODE

      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: aeroventa-v40-visual-qa
          path: |
            reports/v40-visual-qa.json
            reports/v40-renders
          if-no-files-found: error
          retention-days: 7
