name: v40-visual-qa

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: v40-hi-end-evidence-pass-2026-10-03
          fetch-depth: 0

      - name: Bind Owner-supplied media once
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p apps/web/public/evidence/hero apps/web/public/evidence/7park
          curl -fsSL 'https://sdmntprwestcentralus.oaiusercontent.com/files/00000000-3470-81fb-a594-2a4ce0176f72/raw?se=2026-10-03T19%3A35%3A30Z&sp=r&sv=2026-02-06&sr=b&scid=ab6ab70c-9f63-590a-b286-6fd60c252c66&skoid=18c14e53-ea0c-429b-8d09-d22d66ca7169&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-03T16%3A27%3A26Z&ske=2026-10-04T16%3A27%3A26Z&sks=b&skv=2026-02-06&sig=ILQGJ0Le8NTOR3pOEL7JyGHGBRTHTpMOo/jjQ%2B5%2BsxM%3D' -o apps/web/public/evidence/hero/engineering-ductwork.jpg
          curl -fsSL 'https://sdmntprwestcentralus.oaiusercontent.com/files/00000000-b1d0-81fb-b4b0-36b1e2c854a9/raw?se=2026-10-03T19%3A35%3A31Z&sp=r&sv=2026-02-06&sr=b&scid=bb08e7f5-b5c9-5cec-8f9a-d09337d5fb6c&skoid=18c14e53-ea0c-429b-8d09-d22d66ca7169&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-03T16%3A28%3A24Z&ske=2026-10-04T16%3A28%3A24Z&sks=b&skv=2026-02-06&sig=tCRQ0q0P94gmV76/rAXI%2Bhf25D/sPwDAgXyZSUF71x0%3D' -o apps/web/public/evidence/7park/object-exterior-day.jpg
          curl -fsSL 'https://sdmntprwestcentralus.oaiusercontent.com/files/00000000-7ccc-81fb-a501-2b6729ae18d2/raw?se=2026-10-03T19%3A35%3A32Z&sp=r&sv=2026-02-06&sr=b&scid=135aee1c-eb6b-55b7-be28-b2dfd2e7581b&skoid=18c14e53-ea0c-429b-8d09-d22d66ca7169&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-03T16%3A28%3A24Z&ske=2026-10-04T16%3A28%3A24Z&sks=b&skv=2026-02-06&sig=zi79nuf0qKrpVGc5ZNXiDSec/NzHJ4g8Gcf1LQMqLMg%3D' -o apps/web/public/evidence/7park/object-courtyard-night.jpg
          echo '1a5a2ee0a5601d48149f0482b7722062a66764ec4106cd8b7447ca6ec20826e2  apps/web/public/evidence/hero/engineering-ductwork.jpg' | sha256sum -c -
          echo '80ddcce67a4c2e97965b48daa324baacce6284aaaee9f53312af4e8fbbd53ac1  apps/web/public/evidence/7park/object-exterior-day.jpg' | sha256sum -c -
          echo 'a6e21990d709a8cb08bf14ce94d5a04e5e81856b8ef0298673e841b6041a4147  apps/web/public/evidence/7park/object-courtyard-night.jpg' | sha256sum -c -
          git add apps/web/public/evidence/hero/engineering-ductwork.jpg apps/web/public/evidence/7park/object-exterior-day.jpg apps/web/public/evidence/7park/object-courtyard-night.jpg
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'V40: bind Owner-supplied evidence media'
            git push origin HEAD:v40-hi-end-evidence-pass-2026-10-03
          fi

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'

      - name: Install project
        run: npm install --no-audit --no-fund

      - name: Build fixture
        env:
          AEROVENTA_RELEASE_MODE: fixture
        run: npm run build:web

      - name: Install browser QA dependency
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start preview
        run: |
          npm --workspace @aeroventa/web run preview -- --host 127.0.0.1 --port 4321 > /tmp/aeroventa-preview.log 2>&1 &
          echo $! > /tmp/aeroventa-preview.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4321/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/aeroventa-preview.log
          exit 1

      - name: Render responsive evidence
        run: |
          mkdir -p reports/v40-renders
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          import fs from 'node:fs';

          const targets = [
            { name: 'desktop-1440', width: 1440, height: 1000, fullPage: false },
            { name: 'tablet-834', width: 834, height: 1112, fullPage: false },
            { name: 'mobile-390', width: 390, height: 844, fullPage: false },
            { name: 'mobile-320', width: 320, height: 720, fullPage: false },
            { name: 'mobile-390-full', width: 390, height: 844, fullPage: true },
          ];

          const browser = await chromium.launch();
          const results = [];
          let failed = false;

          for (const target of targets) {
            const context = await browser.newContext({
              viewport: { width: target.width, height: target.height },
              deviceScaleFactor: 1,
              reducedMotion: 'reduce',
            });
            const page = await context.newPage();
            const consoleErrors = [];
            const pageErrors = [];
            page.on('console', msg => { if (msg.type() === 'error') consoleErrors.push(msg.text()); });
            page.on('pageerror', err => pageErrors.push(String(err)));

            const response = await page.goto('http://127.0.0.1:4321/', { waitUntil: 'networkidle' });
            const checks = await page.evaluate(() => ({
              overflow: document.documentElement.scrollWidth - window.innerWidth,
              caseImages: document.querySelectorAll('.case-feature img').length,
              heroSupply: Boolean(document.querySelector('.hero-airflow-path--supply')),
              heroExhaust: Boolean(document.querySelector('.hero-airflow-path--exhaust')),
              brandLoaded: Boolean(document.querySelector('.brand-wordmark')?.complete),
              title: document.title,
              h1: document.querySelector('h1')?.textContent?.trim() || '',
            }));

            const pass =
              response?.status() === 200 &&
              checks.overflow <= 1 &&
              checks.caseImages === 2 &&
              checks.heroSupply &&
              checks.heroExhaust &&
              checks.brandLoaded &&
              consoleErrors.length === 0 &&
              pageErrors.length === 0;

            if (!pass) failed = true;
            results.push({
              ...target,
              http: response?.status() ?? null,
              ...checks,
              consoleErrors,
              pageErrors,
              pass,
            });

            await page.screenshot({
              path: `reports/v40-renders/${target.name}.png`,
              fullPage: target.fullPage,
            });
            await context.close();
          }

          await browser.close();
          fs.writeFileSync('reports/v40-visual-qa.json', JSON.stringify({
            generatedAt: new Date().toISOString(),
            verdict: failed ? 'FAIL' : 'PASS',
            results,
          }, null, 2));
          console.log(JSON.stringify({ verdict: failed ? 'FAIL' : 'PASS', results }, null, 2));
          if (failed) process.exit(1);
          NODE

      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: aeroventa-v40-visual-qa
          path: |
            reports/v40-visual-qa.json
            reports/v40-renders
          if-no-files-found: error
          retention-days: 7
